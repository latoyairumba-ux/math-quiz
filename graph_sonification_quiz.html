<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Sonification Quiz</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            margin: 0;
            padding: 30px;
            line-height: 1.6;
        }

        main {
            max-width: 750px;
            margin: auto;
        }

        h1 {
            font-size: 2rem;
        }

        .quiz-box {
            margin-top: 25px;
            padding: 25px;
            border: 2px solid white;
            border-radius: 10px;
        }

        audio {
            width: 100%;
            margin: 20px 0;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            font-size: 1.1rem;
            padding: 12px 20px;
            border: 2px solid white;
            border-radius: 6px;
            background: #1f2937;
            color: white;
            cursor: pointer;
            text-align: left;
        }

        button:hover {
            background: #374151;
        }

        button:focus {
            outline: 4px solid #60a5fa;
            outline-offset: 3px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #feedback {
            min-height: 30px;
            font-weight: bold;
            margin-top: 20px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<main>

    <h1>Graph Sonification Quiz</h1>

    <p id="progress" aria-live="polite"></p>

    <section id="quizArea" class="quiz-box">

        <h2>Listen to the audio</h2>

        <p>
            Listen to the audio and identify the type of equation
            represented by the sound.
        </p>

        <audio id="audio" controls>
            Your browser does not support audio playback.
        </audio>

        <h2>Choose the equation type</h2>

        <div class="answers">

            <button type="button" data-answer="Linear">
                Linear
            </button>

            <button type="button" data-answer="Quadratic">
                Quadratic
            </button>

            <button type="button" data-answer="Cubic">
                Cubic
            </button>

            <button type="button" data-answer="Absolute value">
                Absolute value
            </button>

            <button type="button" data-answer="Trigonometric">
                Trigonometric
            </button>

        </div>

        <p id="feedback" aria-live="assertive"></p>

        <button
            id="nextButton"
            type="button"
            class="hidden">
            Next question
        </button>

    </section>

    <section id="finished" class="quiz-box hidden">

        <h2>Quiz complete</h2>

        <p>
            Thank you for completing the quiz.
        </p>

        <p>
            Your results have been recorded.
        </p>

    </section>

</main>

<script>

const questions = [

    {
        audio: "audio/log/y=2x+3 log.wav",
        answer: "Linear"
    },

    {
        audio: "audio/log/y=abs(x-2)+1 log.wav",
        answer: "Absolute value"
    },

    {
        audio: "audio/log/y=sin(x) log.wav",
        answer: "Trigonometric"
    },

    {
        audio: "audio/log/y=x^2−4x+3 log.wav",
        answer: "Quadratic"
    },

    {
        audio: "audio/log/y=x^3−3x^2+2 log.wav",
        answer: "Cubic"
    },

    {
        audio: "audio/linear/y=2x+3 linear.wav",
        answer: "Linear"
    },

    {
        audio: "audio/linear/y=abs(x-2)+1 linear.wav",
        answer: "Absolute value"
    },

    {
        audio: "audio/linear/y=sin(x) linear.wav",
        answer: "Trigonometric"
    },

    {
        audio: "audio/linear/y=x^2−4x+3 linear.wav",
        answer: "Quadratic"
    },

    {
        audio: "audio/linear/y=x^3−3x^2+2 linear.wav",
        answer: "Cubic"
    }

];

let currentQuestion = 0;

let score = 0;

let answered = false;

const audio =
    document.getElementById("audio");

const progress =
    document.getElementById("progress");

const feedback =
    document.getElementById("feedback");

const nextButton =
    document.getElementById("nextButton");

const quizArea =
    document.getElementById("quizArea");

const finished =
    document.getElementById("finished");

const answerButtons =
    document.querySelectorAll("[data-answer]");

function loadQuestion() {

    answered = false;

    progress.textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;

    audio.src =
        questions[currentQuestion].audio;

    audio.load();

    feedback.textContent = "";

    nextButton.classList.add("hidden");

    answerButtons.forEach(function(button) {

        button.disabled = false;

    });

    audio.focus();

}

function checkAnswer(selectedAnswer) {

    if (answered) {

        return;

    }

    answered = true;

    const correctAnswer =
        questions[currentQuestion].answer;

    if (selectedAnswer === correctAnswer) {

        score++;

    }

    answerButtons.forEach(function(button) {

        button.disabled = true;

    });

    feedback.textContent =
        "Answer recorded.";

    nextButton.classList.remove("hidden");

    nextButton.focus();

}

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= questions.length) {

        finishQuiz();

    } else {

        loadQuestion();

    }

}

function finishQuiz() {

    quizArea.classList.add("hidden");

    finished.classList.remove("hidden");

    console.log(
        "Final score:",
        score,
        "out of",
        questions.length
    );

}

answerButtons.forEach(function(button) {

    button.addEventListener(
        "click",
        function() {

            checkAnswer(
                button.dataset.answer
            );

        }
    );

});

nextButton.addEventListener(
    "click",
    nextQuestion
);

loadQuestion();

</script>

</body>
</html>
